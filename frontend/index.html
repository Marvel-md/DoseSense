<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoseSense</title>
<style>
/* ---------------------------------------------------------------------------
   Visual language follows the supplied reference: a tinted page, one white
   sheet floating on it, soft rounded cards, a single deep-teal accent card, a
   heavy tight display face, and a row of large figures.

   Two departures from the reference, both deliberate.

   The percentages in the reference are placeholders from a mockup. Every number
   in the stats row here is fetched from /api/metrics at runtime, which is the
   saved output of ml/evaluate.py. If the evaluation has not been run, the row
   hides itself rather than showing a figure nobody measured.

   The three feature cards are built from the live cohort rather than a drawn
   mock, so the front page shows the system working rather than a picture of it.
--------------------------------------------------------------------------- */

:root{
  --tint:#DCE9E9;
  --sheet:#FFFFFF;
  --ink:#14181B;
  --body:#4C565E;
  --quiet:#7A8690;
  --faint:#9EA9B2;
  --card:#F2F6F5;
  --card-line:#E7EDEB;
  --hair:#E9EDEF;
  --teal:#1F5B55;
  --clay:#9E3833;
  --sage:#2F6B5A;

  --sans:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-lg:22px;
  --r-md:14px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--tint);
  background-image:linear-gradient(160deg,#D9E8E8 0%,#E8F0EF 45%,#DCE9E9 100%);
  background-attachment:fixed;
  color:var(--ink);
  font:16px/1.6 var(--sans);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}

.page{max-width:1180px;margin:0 auto;padding:22px 22px 56px}

/* ---------- role selector ---------- */
.nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;
  padding:0 6px}
.brand{font-weight:700;letter-spacing:-.02em;font-size:1.02rem;color:#26403D}
.roles{display:flex;background:rgba(255,255,255,.62);border-radius:999px;padding:4px;
  gap:2px;box-shadow:0 1px 2px rgba(20,24,27,.05)}
.roles button{border-radius:999px;padding:8px 18px;font-size:.87rem;color:var(--body);
  display:flex;align-items:center;gap:7px;transition:background .16s ease,color .16s ease}
.roles button svg{width:15px;height:15px}
.roles button[aria-pressed="true"]{background:var(--teal);color:#fff}
.nav .who-am-i{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:.85rem;
  color:var(--body)}
.nav select{font:inherit;font-size:.85rem;background:rgba(255,255,255,.72);border:0;
  border-radius:999px;padding:8px 14px;color:var(--ink);max-width:16rem}
.nav select:focus{outline:2px solid var(--teal);outline-offset:2px}
.demo-flag{font-size:.74rem;color:#5E7370;background:rgba(255,255,255,.55);
  border-radius:999px;padding:5px 11px}

/* ---------- patient portal ---------- */
.greet{font-size:clamp(1.6rem,3vw,2.35rem);font-weight:700;letter-spacing:-.03em;margin:0}
.greet-sub{color:var(--body);font-size:1rem;margin:10px 0 0;max-width:50ch;line-height:1.6}
.portal-top{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;
  align-items:start;margin:26px 0 30px}
.regimen{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:22px 24px}
.regimen h3{font-size:.86rem;font-weight:600;color:var(--quiet);margin:0 0 14px}
.med{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:9px 0}
.med+.med{border-top:1px solid var(--card-line)}
.med .nm{font-weight:600;font-size:.98rem}
.med .fq{font-size:.83rem;color:var(--quiet)}
.next{background:var(--teal);color:#EAF3F1;border-radius:var(--r-lg);padding:22px 24px}
.next h3{font-size:.86rem;font-weight:600;color:#BEDAD5;margin:0 0 10px}
.next .when{font-size:1.65rem;font-weight:700;letter-spacing:-.03em;color:#fff;line-height:1.2}
.next p{font-size:.86rem;color:#C6DCD8;margin:10px 0 0;line-height:1.55}

.ask{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:26px 28px;margin-bottom:22px}
.ask>h2{font-size:1.3rem;font-weight:700;letter-spacing:-.022em;margin:0 0 6px}
.ask>.intro{color:var(--body);font-size:.94rem;margin:0 0 24px;max-width:58ch;line-height:1.6}
.q{padding:20px 0;border-top:1px solid var(--card-line)}
.q:first-of-type{border-top:0;padding-top:0}
.q h4{font-size:1rem;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.q .hint{font-size:.85rem;color:var(--quiet);margin:0 0 14px;line-height:1.5}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{background:#FFF;border:1px solid var(--card-line);border-radius:999px;
  padding:10px 18px;font-size:.9rem;transition:border-color .14s ease,background .14s ease}
.choices button:hover{border-color:#B8CCC8}
.choices button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags button{background:#FFF;border:1px solid var(--card-line);border-radius:999px;
  padding:9px 16px;font-size:.87rem;display:flex;align-items:center;gap:8px}
.tags button:hover{border-color:#B8CCC8}
.tags button[aria-pressed="true"]{background:#E8F1EF;border-color:var(--teal);color:#1B4B46}
.tags button .mark{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--card-line);
  display:grid;place-items:center;font-size:.62rem;line-height:1;flex:none}
.tags button[aria-pressed="true"] .mark{background:var(--teal);border-color:var(--teal);color:#fff}
.slider-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
input[type=range]{flex:1;min-width:13rem;accent-color:var(--teal);height:28px}
.slider-val{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;min-width:2.4rem;text-align:center}
.slider-ends{display:flex;justify-content:space-between;font-size:.79rem;color:var(--faint);
  margin-top:2px}
input[type=date],textarea{font:inherit;font-size:.9rem;background:#FFF;
  border:1px solid var(--card-line);border-radius:12px;padding:10px 14px;color:var(--ink);width:100%}
textarea{min-height:5.2rem;resize:vertical;line-height:1.55}
input[type=date]{max-width:13rem}
input[type=date]:focus,textarea:focus{outline:none;border-color:var(--teal)}
.send{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:22px;
  border-top:1px solid var(--card-line);margin-top:4px}
.send button{background:var(--teal);color:#fff;border-radius:999px;padding:12px 28px;
  font-size:.94rem;font-weight:500}
.send button:hover{background:#194A45}
.send button[disabled]{opacity:.5;cursor:default}
.send .said{font-size:.88rem;color:var(--sage)}
.privacy{font-size:.82rem;color:var(--quiet);margin:16px 0 0;line-height:1.6;max-width:66ch;
  padding-left:13px;border-left:2px solid var(--card-line)}

.past{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:22px 24px}
.past h3{font-size:1.02rem;font-weight:600;margin:0 0 4px}
.past>p{font-size:.86rem;color:var(--body);margin:0 0 14px}
.past ul{list-style:none;margin:0;padding:0}
.past li{padding:13px 0;border-top:1px solid var(--card-line);font-size:.89rem}
.past li:first-child{border-top:0}
.past .when{font-size:.79rem;color:var(--faint);display:block;margin-bottom:3px}
.past .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.past .chips span{background:#FFF;border:1px solid var(--card-line);border-radius:999px;
  padding:3px 10px;font-size:.78rem;color:var(--body)}

/* what the patient said, in the clinician view: a fourth rule style */
.pane.said h3:before{border-top-style:double;border-top-width:4px}
.saidlist{list-style:none;margin:0;padding:0}
.saidlist li{font-size:.87rem;line-height:1.5;padding:8px 0;color:var(--body)}
.saidlist li+li{border-top:1px solid var(--card-line)}
.saidlist .when{color:var(--faint);font-size:.78rem;display:block}
.sheet{
  background:var(--sheet);border-radius:28px;padding:44px 46px 40px;
  box-shadow:0 1px 2px rgba(20,24,27,.04),0 12px 40px rgba(20,24,27,.06);
}

.tag{display:inline-block;background:var(--card);color:var(--body);border-radius:999px;
  padding:7px 17px;font-size:.83rem;font-weight:500;margin-bottom:22px}
.head{display:grid;grid-template-columns:1.35fr 1fr;gap:38px;align-items:end;margin-bottom:38px}
h1{font-size:clamp(1.9rem,3.3vw,2.85rem);line-height:1.12;font-weight:700;
  letter-spacing:-.028em;margin:0;max-width:17ch;text-wrap:balance}
.head p{color:var(--body);font-size:.98rem;line-height:1.65;margin:0 0 6px;max-width:44ch}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:22px 22px 24px;display:flex;flex-direction:column;min-height:312px}
.card.dark{background:var(--teal);border-color:var(--teal);color:#EAF3F1}
.card .cap{display:flex;align-items:center;gap:9px;font-size:.93rem;font-weight:500;color:var(--body)}
.card.dark .cap{color:#BEDAD5}
.card .cap svg{width:17px;height:17px;flex:none}
.card .stage{flex:1;margin:18px 0;display:flex;flex-direction:column;gap:9px;justify-content:center}
.card h3{font-size:1.06rem;line-height:1.4;font-weight:600;margin:0;letter-spacing:-.01em}
.card p{font-size:.88rem;line-height:1.55;color:var(--body);margin:7px 0 0}
.card.dark h3{color:#FFF}
.card.dark p{color:#C6DCD8}

.tile{background:#FFF;border-radius:var(--r-md);padding:13px 15px;
  box-shadow:0 1px 3px rgba(20,24,27,.06)}
.tile .t1{font-weight:600;font-size:.95rem;display:block}
.tile .t2{font-size:.79rem;color:var(--quiet);margin-top:1px;display:block;line-height:1.4}
.tile.row{display:flex;align-items:center;gap:11px}
.tile .dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--card);font-size:.74rem;font-weight:600;color:var(--body)}
.tile.up{border-left:3px solid var(--clay)}
.tile.calm{border-left:3px solid var(--sage)}
.tile .big{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;flex:none}
.tile .big.up{color:var(--clay)}
.tile .big.calm{color:var(--sage)}
.card.dark .tile{background:rgba(255,255,255,.09);box-shadow:none;color:#EAF3F1}
.card.dark .tile .t2{color:#A9C6C1}
.card.dark .tile .dot{background:rgba(255,255,255,.14);color:#DCEBE8}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;
  border-top:1px solid var(--hair);padding-top:34px}
.stat .n{font-size:clamp(2rem,4vw,3.1rem);font-weight:700;letter-spacing:-.04em;line-height:1}
.stat .l{font-size:.89rem;color:var(--body);margin-top:9px;line-height:1.45;max-width:26ch}
.stats-note{grid-column:1/-1;font-size:.78rem;color:var(--faint);margin:2px 0 0;line-height:1.5}

.work{margin-top:44px;border-top:1px solid var(--hair);padding-top:34px}
.work-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.work-head h2{font-size:1.4rem;font-weight:700;letter-spacing:-.022em;margin:0}
.work-head p{color:var(--body);font-size:.92rem;margin:0;flex:1;min-width:16rem}

.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:18px}
.filters button{background:var(--card);border:1px solid transparent;border-radius:999px;
  padding:7px 15px;font-size:.85rem;color:var(--body)}
.filters button:hover{border-color:#CFDCD9}
.filters button[aria-pressed="true"]{background:var(--teal);color:#fff}
.filters .n{opacity:.6;margin-left:6px;font-size:.79rem}
.filters .find{margin-left:auto}
.filters input{font:inherit;font-size:.85rem;background:var(--card);border:1px solid transparent;
  border-radius:999px;padding:8px 16px;width:12rem;color:var(--ink)}
.filters input::placeholder{color:var(--faint)}
.filters input:focus{outline:none;border-color:var(--teal)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.row{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:17px 21px;display:grid;grid-template-columns:1fr 5.4rem 4.4rem;gap:8px 18px;
  align-items:center;cursor:pointer;transition:border-color .16s ease,transform .16s ease}
.row:hover{border-color:#CFDCD9;transform:translateY(-1px)}
.who{font-size:1.02rem;font-weight:600;letter-spacing:-.01em}
.meta{color:var(--quiet);font-size:.81rem;margin-top:1px}
.note{color:var(--body);font-size:.86rem;margin-top:7px;max-width:54ch}
.pct{text-align:right;font-size:1.28rem;font-weight:700;letter-spacing:-.025em}
.pct .conf{display:block;font-size:.71rem;font-weight:400;color:var(--faint);
  letter-spacing:0;margin-top:2px}
.flagged .pct{color:var(--clay)}
.settled .pct{color:var(--sage)}
.trend svg{width:4.2rem;height:1.1rem;display:block;margin-left:auto}

.empty{padding:46px 4px;color:var(--body);font-size:.93rem}
.empty b{display:block;font-size:1.15rem;font-weight:700;color:var(--ink);margin-bottom:6px}

.tour{margin-top:34px;border-top:1px solid var(--hair);padding-top:28px}
.tour h2{font-size:1.18rem;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.tour>p{color:var(--body);font-size:.9rem;margin:0 0 18px;max-width:64ch}
.tour ol{list-style:none;margin:0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:11px}
.tour li{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-md);
  padding:15px 17px;font-size:.86rem;color:var(--body);line-height:1.5}
.tour b{display:block;color:var(--ink);font-weight:600;margin-bottom:3px}
.tour button{color:var(--teal);font-weight:500;margin-top:7px;display:block}
.tour button:hover{text-decoration:underline}

.back{color:var(--body);font-size:.89rem;margin-bottom:22px}
.back:hover{color:var(--ink)}
.pt-head{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:start;margin-bottom:28px}
.pt-name{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:700;letter-spacing:-.03em;margin:0}
.pt-sum{color:var(--body);font-size:.95rem;margin:8px 0 0;max-width:46ch}
.verdict{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:22px 24px}
.verdict .big{font-size:3rem;font-weight:700;letter-spacing:-.045em;line-height:1}
.verdict .big.up{color:var(--clay)}
.verdict .big.calm{color:var(--sage)}
.verdict .big.grey{color:var(--faint)}
.verdict .what{font-size:.95rem;line-height:1.55;margin:11px 0 0;color:var(--ink)}
.verdict .aside{font-size:.85rem;color:var(--quiet);margin:7px 0 0}

.panes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:26px}
.pane{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:20px 22px}
.pane.dark{background:var(--teal);border-color:var(--teal);color:#EAF3F1}
.pane h3{font-size:.86rem;font-weight:600;color:var(--quiet);margin:0 0 12px;
  display:flex;align-items:center;gap:8px}
.pane.dark h3{color:#BEDAD5}
.pane h3:before{content:"";width:16px;height:0;flex:none;border-top:2px solid currentColor}
.pane.estimated h3:before{border-top-style:dashed}
.pane.possible h3:before{border-top-style:dotted}
.pane.possible p:first-of-type{font-style:italic}
.pane p{font-size:.89rem;line-height:1.55;margin:0 0 8px;color:var(--body)}
.pane.dark p{color:#C6DCD8}
.pane p:last-child{margin-bottom:0}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{font-size:.88rem;line-height:1.5;padding:6px 0;color:var(--body)}
ul.plain li+li{border-top:1px solid var(--card-line)}
.pane.dark ul.plain li{color:#D3E5E1}
.pane.dark ul.plain li+li{border-top-color:rgba(255,255,255,.13)}
.pairs{margin-top:12px;font-size:.83rem;color:var(--quiet)}
.pairs div{display:flex;justify-content:space-between;gap:14px;padding:4px 0}
.pairs b{color:var(--ink);font-weight:600}
.pane.dark .pairs{color:#A9C6C1}
.pane.dark .pairs b{color:#fff}

figure{margin:0 0 18px;background:var(--card);border:1px solid var(--card-line);
  border-radius:var(--r-lg);padding:20px 22px}
figure h4{font-size:1rem;font-weight:600;letter-spacing:-.012em;margin:0 0 14px}
figcaption{font-size:.83rem;color:var(--quiet);margin-top:11px;line-height:1.5}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
svg{display:block;max-width:100%;overflow:visible}
.gl{stroke:#DDE5E3;stroke-width:1}
.ax{stroke:#CFDAD7;stroke-width:1}
.tick{font:10px var(--sans);fill:var(--faint)}
.cp{stroke:var(--quiet);stroke-width:1;stroke-dasharray:3 3}
.cpt{font:9.5px var(--sans);fill:var(--quiet)}
.nodata{font-size:.87rem;color:var(--quiet);margin:0}

.tl{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto}
.tl li{display:grid;grid-template-columns:4.6rem 1fr;gap:12px;padding:6px 0 6px 11px;
  font-size:.86rem;border-left:2px solid #DDE5E3;color:var(--body)}
.tl li.notable{border-left-color:var(--faint)}
.tl li.adverse{border-left-color:var(--clay)}
.tl li.inference{border-left-style:dashed;border-left-color:var(--quiet);
  font-style:italic;color:var(--quiet)}
/* A gap is the absence of a record, so it is drawn as an absence: no solid
   rule, hatched fill, muted text. It should read as a hole in the page. */
.tl li.gap{border-left:2px dotted #C2CECB;color:var(--faint);
  background:repeating-linear-gradient(135deg,transparent,transparent 5px,
    rgba(122,134,144,.055) 5px,rgba(122,134,144,.055) 10px)}
.cov{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.cov span{display:flex;align-items:center;gap:7px;background:#FFF;
  border:1px solid var(--card-line);border-radius:999px;padding:5px 13px;font-size:.8rem;
  color:var(--body)}
.cov span i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--sage)}
.cov span.sparse i{background:var(--clay)}
.cov span.absent i{background:transparent;border:1.5px dashed var(--faint)}
.cov span.sparse{border-color:#E4C9C8}
.cov-note{font-size:.82rem;color:var(--quiet);margin:0 0 16px;line-height:1.55}

.acts-list{list-style:none;margin:12px 0 0;padding:0}
.acts-list li{padding:12px 0;border-top:1px solid var(--card-line)}
.acts-list li:first-child{border-top:0}
.acts-list .step{font-weight:600;font-size:.92rem;display:flex;align-items:baseline;
  gap:9px;flex-wrap:wrap}

/* Side-by-side: what the conventional measure concludes, next to what we do.
   The whole argument of the project is the difference between these two
   columns, so it gets a panel of its own rather than a footnote. */
.versus{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--card-line);
  border-radius:var(--r-lg);overflow:hidden;margin-bottom:26px}
.versus>div{padding:18px 20px}
.versus .old{background:#F7F8F8;border-right:1px solid var(--card-line)}
.versus .new{background:var(--card)}
.versus h4{font-size:.8rem;font-weight:600;color:var(--quiet);margin:0 0 10px}
.versus .verdict-line{font-size:1.02rem;font-weight:700;letter-spacing:-.015em;margin:0 0 10px}
.versus .old .verdict-line{color:var(--quiet)}
.versus .new .verdict-line{color:var(--clay)}
.versus .new.calm .verdict-line{color:var(--sage)}
.versus ul{list-style:none;margin:0;padding:0}
.versus li{font-size:.85rem;color:var(--body);padding:4px 0;display:flex;gap:8px;
  align-items:flex-start;line-height:1.45}
.versus li b{flex:none;width:1rem;text-align:center;color:var(--faint);font-weight:400}
.versus .miss{color:var(--faint);font-style:italic}

.cf{list-style:none;margin:12px 0 0;padding:0}
.cf li{display:grid;grid-template-columns:1fr 3.4rem 4.4rem;gap:10px;align-items:center;
  padding:6px 0;font-size:.85rem;color:var(--body)}
.cf li+li{border-top:1px solid var(--card-line)}
.cf .val{text-align:right;font-weight:600;color:var(--ink)}
.cf .bar{height:7px;border-radius:2px;background:#E4EAE8;position:relative;overflow:hidden}
.cf .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);display:block}
.robust{font-size:.82rem;color:var(--quiet);margin:10px 0 0;line-height:1.55}
.robust b{color:var(--ink)}
.acts-list .why{font-size:.85rem;color:var(--body);margin-top:4px;line-height:1.5}
.eff{font-size:.71rem;font-weight:500;border-radius:999px;padding:2px 9px;
  background:#E8F1EF;color:#1B4B46;flex:none}
.eff.medium{background:#FAF0DC;color:#7A5710}
.eff.high{background:#F6E6E5;color:#8A2F2D}
.owner{font-size:.78rem;color:var(--faint);font-weight:400}
.pane.dark .acts-list li{border-top-color:rgba(255,255,255,.13)}
.pane.dark .acts-list .why{color:#C6DCD8}
.pane.dark .eff{background:rgba(255,255,255,.16);color:#EAF3F1}
.tl .d{color:var(--faint);font-size:.78rem;white-space:nowrap}

.review{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:22px 24px}
.review h3{font-size:1.02rem;font-weight:600;margin:0 0 3px}
.review>p{font-size:.86rem;color:var(--body);margin:0 0 14px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts button{background:#FFF;border:1px solid var(--card-line);border-radius:999px;
  padding:9px 17px;font-size:.86rem}
.acts button:hover{border-color:var(--teal);color:var(--teal)}
.acts button.no:hover{border-color:var(--clay);color:var(--clay)}
.done{margin-top:13px;font-size:.86rem;color:var(--sage)}
.hist{list-style:none;margin:12px 0 0;padding:0;font-size:.82rem;color:var(--quiet)}
.hist li{padding:4px 0;border-top:1px solid var(--card-line)}

.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--hair);
  font-size:.82rem;color:var(--faint);max-width:80ch;line-height:1.6}

@media (max-width:980px){
  .head,.pt-head,.portal-top{grid-template-columns:1fr;gap:18px}
  .cards,.panes{grid-template-columns:1fr}
  .card{min-height:0}
  .stats{grid-template-columns:1fr 1fr;gap:22px}
  .figs{grid-template-columns:1fr}
}
@media (max-width:620px){
  .page{padding:14px 12px 40px}
  .sheet{padding:26px 20px 28px;border-radius:20px}
  .row{grid-template-columns:1fr 4.4rem}
  .trend{display:none}
  .filters .find{margin-left:0;width:100%}
  .filters input{width:100%}
  .ask{padding:20px 18px}
  .nav .who-am-i{margin-left:0;width:100%}
  .nav select{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.filters,.back,.review,.tour{display:none}
  body{background:#fff}.sheet{box-shadow:none;padding:0}}
</style>
</head>
<body>
<div class="page">
  <nav class="nav" id="nav"></nav>
  <div class="sheet"><main id="main"><p class="nodata">Loading…</p></main></div>
</div>

<script>
"use strict";

const S = { queue: [], overview: null, demo: null, metrics: null,
            filters: { state: null, q: "" }, view: "list",
            role: "doctor",              // "doctor" | "patient"
            me: null,                    // which patient the portal is signed in as
            portal: null,
            draft: { doses: null, symptom: null, barriers: [], note: "", date: null } };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const pct = v => v == null ? "\u2014" : Math.round(v * 100) + "%";
const fx = (v, n = 2) => v == null ? "\u2014" : Number(v).toFixed(n);
const dmy = s => { if (!s) return ""; const d = new Date(s + "T00:00:00");
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "2-digit" }); };
const words = n => ["no","one","two","three","four","five","six","seven","eight","nine",
                    "ten","eleven","twelve"][n] || String(n);

async function get(p) {
  const r = await fetch(p);
  if (!r.ok) throw new Error(p + " returned " + r.status);
  return r.json();
}

const ICON = {
  signals: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
    stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2-6 3 13 3-9 2 4h5"/></svg>`,
  judge: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
    stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 8l7-5 7 5"/><path
    d="M5 8l-2 6a3 3 0 0 0 6 0z"/><path d="M19 8l2 6a3 3 0 0 1-6 0z"/></svg>`,
  doctor: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6a5 5 0 0 0 10 0V3"/><path
    d="M5 3v7a7 7 0 0 0 7 7"/><circle cx="19" cy="17" r="3"/></svg>`,
  patient: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path
    d="M4 21a8 8 0 0 1 16 0"/></svg>`,
  queue: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
    stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle
    cx="3.5" cy="6" r="1.3"/><circle cx="3.5" cy="12" r="1.3"/><circle cx="3.5" cy="18" r="1.3"/></svg>`,
};

/* ------------------------------------------------------------- figures */

function sparkline(vals) {
  if (!vals || vals.length < 2) return "";
  const w = 62, h = 16, n = vals.length;
  const X = i => (i / (n - 1)) * (w - 2) + 1, Y = v => h - 1 - v * (h - 2);
  const last = vals[n - 1];
  const col = last >= .5 ? "var(--clay)" : last >= .25 ? "var(--faint)" : "var(--sage)";
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}"
      fill="none" stroke="${col}" stroke-width="1.3"/>
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="1.7" fill="${col}"/></svg>`;
}

function lineChart(points, o = {}) {
  if (!points || points.length < 2)
    return `<p class="nodata">${esc(o.none || "Not enough recorded values to plot.")}</p>`;
  const w = o.w || 560, h = o.h || 140, P = { l: 34, r: 10, t: 12, b: 22 };
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = o.y0 != null ? o.y0 : Math.min(...ys);
  let y1 = o.y1 != null ? o.y1 : Math.max(...ys);
  if (y1 - y0 < 1e-9) y1 = y0 + 1;
  const pad = (y1 - y0) * .14; y0 -= pad; y1 += pad;
  const X = v => P.l + ((v - x0) / ((x1 - x0) || 1)) * (w - P.l - P.r);
  const Y = v => h - P.b - ((v - y0) / ((y1 - y0) || 1)) * (h - P.t - P.b);
  let g = "";
  for (let i = 0; i <= 2; i++) {
    const v = y0 + (i / 2) * (y1 - y0);
    g += `<line class="gl" x1="${P.l}" y1="${Y(v).toFixed(1)}" x2="${w-P.r}" y2="${Y(v).toFixed(1)}"/>
      <text class="tick" x="${P.l-6}" y="${(Y(v)+3.4).toFixed(1)}" text-anchor="end">${fx(v, o.dp == null ? 1 : o.dp)}</text>`;
  }
  const ref = o.refY != null
    ? `<line x1="${P.l}" y1="${Y(o.refY).toFixed(1)}" x2="${w-P.r}" y2="${Y(o.refY).toFixed(1)}"
        stroke="var(--sage)" stroke-width="1" stroke-dasharray="2 3"/>` : "";
  let cp = "";
  if (o.changeX != null && o.changeX >= x0 && o.changeX <= x1) {
    const cx = X(o.changeX).toFixed(1);
    cp = `<line class="cp" x1="${cx}" y1="${P.t}" x2="${cx}" y2="${h-P.b}"/>
      <text class="cpt" x="${cx}" y="${P.t-2}" text-anchor="middle">${esc(o.changeLabel||"change")}</text>`;
  }
  const d = points.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const dots = points.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="1.9"
    fill="${o.color||"var(--teal)"}"><title>${esc(p.label||"")} ${fx(p.y,2)}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.aria||"trend")}">
    ${g}${ref}${cp}<line class="ax" x1="${P.l}" y1="${h-P.b}" x2="${w-P.r}" y2="${h-P.b}"/>
    <path d="${d}" fill="none" stroke="${o.color||"var(--teal)"}" stroke-width="1.6"/>${dots}
    <text class="tick" x="${P.l}" y="${h-6}">${esc(points[0].label||"")}</text>
    <text class="tick" x="${w-P.r}" y="${h-6}" text-anchor="end">${esc(points[points.length-1].label||"")}</text>
  </svg>`;
}

function barChart(items, o = {}) {
  if (!items || !items.length) return `<p class="nodata">Nothing to show.</p>`;
  const w = o.w || 560, rh = 22, L = o.labelW || 168, R = 46;
  const h = items.length * rh + 6;
  const mx = Math.max(...items.map(i => Math.abs(i.value)), 1e-9);
  const mid = o.signed ? L + (w - L - R) / 2 : L;
  const span = o.signed ? (w - L - R) / 2 : (w - L - R);
  let out = o.signed ? `<line class="ax" x1="${mid}" y1="2" x2="${mid}" y2="${h-4}"/>` : "";
  items.forEach((it, i) => {
    const y = 3 + i * rh, len = (Math.abs(it.value) / mx) * span, neg = it.value < 0;
    out += `<text class="tick" x="${L-8}" y="${y+14}" text-anchor="end">${esc(it.label)}</text>
      <rect x="${(neg?mid-len:mid).toFixed(1)}" y="${y+5}" width="${Math.max(len,1).toFixed(1)}"
        height="11" rx="2" fill="${it.color||(neg?"var(--sage)":"var(--teal)")}"/>
      <text class="tick" x="${(o.signed?w-R+4:mid+len+6).toFixed(1)}" y="${y+14}">${esc(it.display == null ? fx(it.value,2) : it.display)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.aria||"contributions")}">${out}</svg>`;
}

/* --------------------------------------------------------- role switch */

function renderNav() {
  const opts = S.queue.slice().sort((a, b) => a.patient_id.localeCompare(b.patient_id));
  document.getElementById("nav").innerHTML = `
    <span class="brand">DoseSense</span>
    <div class="roles" role="tablist" aria-label="Choose a view">
      <button data-role="doctor" role="tab" aria-pressed="${S.role === "doctor"}">
        ${ICON.doctor} Doctor workspace</button>
      <button data-role="patient" role="tab" aria-pressed="${S.role === "patient"}">
        ${ICON.patient} Patient portal</button>
    </div>
    ${S.role === "patient" ? `<span class="who-am-i">
      <label for="me" class="demo-flag">Signed in as</label>
      <select id="me" aria-label="Which patient is signed in">
        ${opts.map(r => `<option value="${esc(r.patient_id)}" ${r.patient_id === S.me
          ? "selected" : ""}>${esc(r.patient_id)} — ${esc(r.condition)}</option>`).join("")}
      </select></span>`
    : `<span class="who-am-i demo-flag">Synthetic records. Decision support, not a diagnosis.</span>`}`;

  document.querySelectorAll("[data-role]").forEach(b => b.onclick = () => switchRole(b.dataset.role));
  const me = document.getElementById("me");
  if (me) me.onchange = () => { S.me = me.value; loadPortal(); };
}

async function switchRole(role) {
  if (role === S.role) return;
  S.role = role;
  if (role === "patient") {
    if (!S.me) {
      // Open on somebody with a story to tell rather than the first id in the list.
      const pick = S.queue.find(r => r.alert && r.evidence_families >= 2) || S.queue[0];
      S.me = pick ? pick.patient_id : null;
    }
    renderNav();
    await loadPortal();
  } else {
    S.view = "list";
    renderNav();
    renderList();
  }
  scrollTo(0, 0);
}

/* ------------------------------------------------------------- helpers */

const STATE_WORDS = {
  SUSTAINED_CONCERN: "Sustained concern", RESOLVING: "Settling down",
  TEMPORARY_IRREGULARITY: "One-off irregularity", WITHIN_BASELINE: "Normal for them",
  INSUFFICIENT_EVIDENCE: "Not enough to judge",
};

function shown() {
  const f = S.filters;
  return S.queue.filter(r =>
    (!f.state || r.state === f.state) &&
    (!f.q || r.patient_id.toLowerCase().includes(f.q) || r.condition.toLowerCase().includes(f.q)));
}

function featureCards() {
  const q = S.queue;
  if (!q.length) return "";
  const flagged = q.find(r => r.alert && r.evidence_families >= 3) || q[0];
  const calm = q.find(r => r.state === "TEMPORARY_IRREGULARITY")
            || q.find(r => !r.alert && !r.abstained) || q[q.length - 1];
  const top = q.filter(r => r.alert).slice(0, 3);

  const fams = `<div class="tile"><span class="t1">${esc(flagged.patient_id)}</span>
      <span class="t2">${flagged.age} year old ${flagged.sex === "F" ? "woman" : "man"},
        ${esc(flagged.condition.toLowerCase())}</span></div>
    <div class="tile row"><span class="dot">${flagged.evidence_families}</span>
      <span><span class="t1" style="font-size:.86rem">kinds of record disagree</span>
      <span class="t2">Pharmacy, symptoms, laboratory, attendance</span></span></div>`;

  const judge = `<div class="tile row up"><span class="big up">${pct(flagged.probability)}</span>
      <span><span class="t1" style="font-size:.86rem">${esc(flagged.patient_id)}</span>
      <span class="t2">Pattern held. Worth a call.</span></span></div>
    <div class="tile row calm"><span class="big calm">${pct(calm.probability)}</span>
      <span><span class="t1" style="font-size:.86rem">${esc(calm.patient_id)}</span>
      <span class="t2">Moved, then came back. Left alone.</span></span></div>`;

  const queue = top.length
    ? top.map(r => `<div class="tile row">
        <span class="dot">${pct(r.probability).replace("%","")}</span>
        <span><span class="t1" style="font-size:.86rem">${esc(r.patient_id)}</span>
        <span class="t2">${esc(r.barrier === "UNKNOWN" ? "No reason inferred" : r.barrier_label)}</span></span>
      </div>`).join("")
    : `<div class="tile"><span class="t2">Nobody needs review today.</span></div>`;

  return `<div class="cards">
    <article class="card">
      <div class="cap">${ICON.signals} Signals</div>
      <div class="stage">${fams}</div>
      <h3>Six kinds of routine record, read together</h3>
      <p>Pharmacy collections, prescription changes, attendance, symptoms, laboratory results and
        activity, each compared against the patient's own history rather than a population average.</p>
    </article>
    <article class="card">
      <div class="cap">${ICON.judge} Judgement</div>
      <div class="stage">${judge}</div>
      <h3>A one-off looks nothing like a pattern</h3>
      <p>The system checks whether a change came back. A holiday is not a decline, and it says so
        instead of raising an alert somebody has to dismiss.</p>
    </article>
    <article class="card dark">
      <div class="cap">${ICON.queue} Review</div>
      <div class="stage">${queue}</div>
      <h3>A ranked queue, with reasons attached</h3>
      <p>Ordered by likelihood, clinical seriousness and how far the estimate can be trusted, each
        with a possible barrier or an honest blank where nothing points clearly.</p>
    </article>
  </div>`;
}

function statsRow() {
  const m = S.metrics;
  if (!m || !m.model) return "";
  const items = [];
  if (m.model.pr_auc != null && m.baseline_pdc)
    items.push([fx(m.model.pr_auc, 2),
      "Precision-recall AUC, against " + fx(m.baseline_pdc.pr_auc, 2) +
      " for the measure hospitals use today"]);
  if (m.alert_burden && m.alert_burden.false_alert_reduction != null)
    items.push([pct(m.alert_burden.false_alert_reduction), "Fewer false alerts per patient-month"]);
  const sil = (m.archetype_behaviour || []).find(r => r.archetype === "SILENT_NONADHERENCE");
  if (sil && sil.baseline_alert_rate)
    items.push([(sil.model_alert_rate / sil.baseline_alert_rate).toFixed(1) + "\u00D7",
      "More cases caught where the pharmacy record looks perfect"]);
  if (m.calibration)
    items.push([fx(m.calibration.expected_calibration_error, 3),
      "Calibration error, so a stated chance means what it says"]);
  if (!items.length) return "";
  return `<div class="stats">
    ${items.map(i => `<div class="stat"><div class="n">${esc(i[0])}</div>
      <div class="l">${esc(i[1])}</div></div>`).join("")}
    <p class="stats-note">Measured on ${m.dataset ? m.dataset.n_test_patients : "held-out"}
      patients the model never saw, using synthetic records. Read from the saved evaluation output
      when this page loads, not written into it.</p>
  </div>`;
}

function renderFilters() {
  const counts = {};
  S.queue.forEach(r => counts[r.state] = (counts[r.state] || 0) + 1);
  const order = ["SUSTAINED_CONCERN","RESOLVING","TEMPORARY_IRREGULARITY",
                 "WITHIN_BASELINE","INSUFFICIENT_EVIDENCE"];
  const btn = (v, t, n) => `<button data-state="${esc(v == null ? "" : v)}"
    aria-pressed="${S.filters.state === v}">${esc(t)}<span class="n">${n}</span></button>`;
  return `<div class="filters">${btn(null,"Everyone",S.queue.length)}
    ${order.filter(k=>counts[k]).map(k=>btn(k,STATE_WORDS[k],counts[k])).join("")}
    <span class="find"><input type="search" id="q" placeholder="Find a patient"
      aria-label="Find a patient" value="${esc(S.filters.q)}"></span></div>`;
}

function renderList() {
  const o = S.overview || {}, rows = shown();

  const head = `<span class="tag">How it works</span>
    <div class="head">
      <h1>Spotting medicine that isn't working, before the next appointment</h1>
      <p>DoseSense reads records a hospital already keeps and estimates whether a patient may be
        having difficulty taking their medicine, without asking them and without ever claiming to
        know that a dose was missed.</p>
    </div>`;

  const work = `<section class="work">
    <div class="work-head">
      <h2>${o.requiring_review == null ? 0 : o.requiring_review} worth a conversation today</h2>
      <p>Ordered by likelihood, how serious a gap would be, and how far the estimate can be
        trusted. ${o.temporary_irregularities == null ? 0 : o.temporary_irregularities} others
        moved away from their own pattern and came back, so they are left alone.</p>
    </div>
    ${renderFilters()}
    ${rows.length ? `<ul class="list">${rows.map(r => {
      const cls = r.alert ? "flagged" : (r.abstained ? "" : "settled");
      return `<li class="row ${cls}" data-go="${esc(r.patient_id)}" tabindex="0" role="button">
        <div><span class="who">${esc(r.patient_id)}</span>
          <div class="meta">${r.age} year old ${r.sex === "F" ? "woman" : "man"} with
            ${esc(r.condition.toLowerCase())}</div>
          <div class="note">${esc(r.top_fact)}</div></div>
        <div class="pct">${pct(r.probability)}<span class="conf">${esc(r.abstained
          ? "too little evidence" : r.confidence.toLowerCase() + " confidence")}</span></div>
        <div class="trend">${sparkline(r.spark)}</div></li>`;
    }).join("")}</ul>`
    : `<div class="empty"><b>No one matches that</b>Clear the filter above to see everyone again.</div>`}
  </section>`;

  const tour = S.demo && S.demo.cases && S.demo.cases.length ? `<section class="tour">
    <h2>Worth a look</h2>
    <p>Eight patients chosen by what they show rather than picked by hand. Each demonstrates
      something different about how the system reasons.</p>
    <ol>${S.demo.cases.map(c => `<li><b>${esc(c.slot)}</b>${esc(c.why)}
      <button data-go="${esc(c.patient_id)}">Open ${esc(c.patient_id)}</button></li>`).join("")}</ol>
  </section>` : "";

  document.getElementById("main").innerHTML = head + featureCards() + statsRow() + work + tour +
    `<p class="foot">Synthetic records throughout. Every figure is an inference drawn from
      indirect signals: nothing here establishes whether a person took a medicine, and nothing
      here is a judgement about them.</p>`;
  wire();
}

function renderDetail(d) {
  const p = d.patient, a = d.assessment;
  const inf = a.inferred, hyp = a.hypothesis, act = a.action, u = inf.uncertainty, s = d.series;
  const tone = inf.abstained ? "grey" : (act.alert ? "up" : "calm");

  const facts = (a.observed.facts || []).length
    ? `<ul class="plain">${a.observed.facts.map(f => `<li>${esc(f.text)}</li>`).join("")}</ul>`
    : `<p>Nothing in this record departs from how this patient normally behaves.</p>`;

  const cpR = (inf.change_detection || {}).refill_delay || {};
  const cpS = (inf.change_detection || {}).symptom || {};

  const meds = (d.medications || []).map(m => m.name.replace(/\s+\d.*$/, "").toLowerCase());
  const medPhrase = meds.length <= 1 ? (meds[0] || "their medication")
    : meds.slice(0,-1).join(", ") + " and " + meds[meds.length-1];

  const tl = (d.timeline || []).slice(-26).reverse().map(e =>
    `<li class="${esc(e.kind)}"><span class="d">${e.kind === "gap" ? "from " + dmy(e.date)
      : dmy(e.date)}</span><span>${esc(e.text)}</span></li>`).join("");

  const hist = (d.feedback || []).length
    ? `<ul class="hist">${d.feedback.map(f => `<li>${esc(f.kind.replace(/_/g," "))} \u2014
        ${esc(f.created_at.replace("T"," "))}</li>`).join("")}</ul>` : "";

  document.getElementById("main").innerHTML = `
  <button class="back" id="back">\u2190 Back to the list</button>
  <div class="pt-head">
    <div>
      <h2 class="pt-name">${esc(p.patient_id)}</h2>
      <p class="pt-sum">${p.age} year old ${p.sex === "F" ? "woman" : "man"} being treated for
        ${esc(p.condition.toLowerCase())} with ${esc(medPhrase)}.${
        p.enrolled_day ? " Joined the panel part-way through the observation period." : ""}</p>
    </div>
    <div class="verdict">
      <div class="big ${tone}">${inf.abstained ? "\u2014" : pct(inf.adherence_concern_probability)}</div>
      <p class="what">${esc(act.message)}</p>
      <p class="aside">${inf.abstained ? "Not enough of this record is available to judge."
        : esc(inf.confidence) + " confidence, drawn from " +
          words(u.independent_evidence_families) + " independent " +
          (u.independent_evidence_families === 1 ? "record" : "kinds of record") + "."}</p>
    </div>
  </div>

  ${(d.coverage || []).length ? `<div class="cov">${d.coverage.map(c =>
    `<span class="${esc(c.status)}" title="${esc(c.note)}"><i></i>${esc(c.channel)}</span>`).join("")}</div>
    ${d.coverage.some(c => c.status !== "covered")
      ? `<p class="cov-note">Channels marked in red are thin or absent for this patient. Where the
          estimate is uncertain, this is usually why — a quiet record and a stable patient look
          identical until you can see which channels were actually measured.</p>` : ""}` : ""}

  ${(() => {
    // The contrast panel only earns its place where the two methods actually
    // disagree. Rendering it on a patient they agree about would be padding.
    const pdc = a.observed.pdc_90;
    const pdcSaysFine = pdc >= 0.8;
    const weAlert = act.alert;
    if (pdcSaysFine === weAlert || inf.abstained) return "";
    const facts = (a.observed.facts || []).slice(0, 4);
    return `<div class="versus">
      <div class="old"><h4>Proportion of days covered — the measure in use today</h4>
        <p class="verdict-line">${pdcSaysFine ? "No alert" : "Alert"}</p>
        <ul>
          <li><b>${pdcSaysFine ? "\u2713" : "\u2717"}</b><span>Days covered over 90 days: ${fx(pdc)}${
            pdcSaysFine ? ", at or above the 0.80 threshold" : ", below the 0.80 threshold"}</span></li>
          <li><b>\u2013</b><span class="miss">Does not read symptoms</span></li>
          <li><b>\u2013</b><span class="miss">Does not read laboratory results</span></li>
          <li><b>\u2013</b><span class="miss">Does not read attendance</span></li>
          <li><b>\u2013</b><span class="miss">Compares against a population threshold, not this patient</span></li>
        </ul></div>
      <div class="new ${weAlert ? "" : "calm"}"><h4>DoseSense</h4>
        <p class="verdict-line">${esc(STATE_WORDS[act.state] || act.state)}</p>
        <ul>${facts.map(f => `<li><b>\u2022</b><span>${esc(f.text)}</span></li>`).join("")}
          <li><b>\u2022</b><span>${u.independent_evidence_families} independent
            ${u.independent_evidence_families === 1 ? "record type" : "record types"} carrying
            evidence, ${esc(inf.confidence.toLowerCase())} confidence</span></li>
        </ul></div>
    </div>`;
  })()}

  <div class="panes">
    <section class="pane recorded"><h3>What the record shows</h3>
      ${facts}
      <div class="pairs">
        <div><span>Days covered, last 90</span><b>${fx(a.observed.pdc_90)}</b></div>
        <div><span>Days since last collection</span><b>${a.observed.days_since_last_dispensing}</b></div>
        <div><span>Last collection late by</span><b>${fx(a.observed.last_refill_delay_days,1)} days</b></div>
        <div><span>Follow-ups missed, 6 months</span><b>${pct(a.observed.missed_followups_180d_rate)}</b></div>
      </div></section>

    <section class="pane estimated"><h3>What DoseSense estimates</h3>
      <p>${inf.abstained ? "The system is declining to give a figure it cannot stand behind."
        : "A " + pct(inf.adherence_concern_probability) + " chance this patient is having " +
          "difficulty taking their medicine as prescribed."}</p>
      ${u.notes && u.notes.length
        ? `<ul class="plain">${u.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      <div class="pairs">
        <div><span>Disagreement between models</span><b>${fx(u.ensemble_disagreement,3)}</b></div>
        <div><span>How complete this record is</span><b>${pct(u.record_completeness)}</b></div>
      </div>
      ${(inf.counterfactual || []).length ? `
        <p class="robust" style="margin-top:14px"><b>What is this resting on?</b> The estimate
          re-run with each record type replaced by typical values.</p>
        <ul class="cf">${inf.counterfactual.map(c => `<li>
          <span>without ${esc(c.label.toLowerCase())}</span>
          <span class="val">${pct(c.probability_without)}</span>
          <span class="bar"><i style="width:${Math.round(c.probability_without*100)}%"></i></span>
        </li>`).join("")}</ul>
        <p class="robust">${inf.evidence_robustness === "corroborated"
          ? "Removing any single record type barely moves the estimate, so this finding is <b>corroborated</b> across several independent sources."
          : inf.evidence_robustness === "rests on one signal"
          ? "Neutralising one record type changes the estimate substantially, so this finding <b>rests largely on one source</b> and is weaker than the number alone suggests."
          : "Removing a record type moves the estimate somewhat: the finding is <b>partly corroborated</b>."}
          These are not causal counterfactuals — the record types overlap, so the changes do not add up.</p>
      ` : ""}
      </section>

    <section class="pane possible dark"><h3>A possible reason</h3>
      <p>${esc(hyp.primary_label)}${hyp.primary !== "UNKNOWN"
        ? ", on " + esc(hyp.confidence.toLowerCase()) + " confidence" : ""}.</p>
      ${hyp.evidence && hyp.evidence.length
        ? `<ul class="plain">${hyp.evidence.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>` : ""}
      <p>${esc(hyp.note)}</p>
      ${(hyp.actions || []).length ? `<ul class="acts-list">${hyp.actions.map(a => `<li>
        <div class="step">${esc(a.step)}<span class="eff ${esc(a.effort)}">${esc(a.effort)} effort</span>
          <span class="owner">${esc(a.owner)}</span></div>
        <div class="why">${esc(a.why)}${a.for_alternative
          ? " Offered because " + esc(a.for_alternative.toLowerCase()) + " fits almost as well." : ""}</div>
      </li>`).join("")}</ul>` : ""}
      </section>
  </div>

  ${(d.self_reports || []).length ? `<section class="pane said"
    style="margin-bottom:26px"><h3>What the patient told us</h3>
    <p>Supplied by the patient through the portal. It is separate evidence, and it played no part
      in the estimate above \u2014 the model does not read it.</p>
    <ul class="saidlist">${d.self_reports.slice(0,5).map(r => `<li>
      <span class="when">${dmy(r.report_date)}</span>
      ${r.doses ? "Took " + esc((r.doses === "unsure" ? "an uncertain number of" : r.doses)) +
        " doses" : "No dose answer"}${r.symptom_score != null
        ? ", rated how they felt " + fx(r.symptom_score,0) + "/10" : ""}.
      ${(r.barrier_labels||[]).length
        ? " They flagged: " + r.barrier_labels.map(x=>esc(x.toLowerCase())).join("; ") + "." : ""}
      ${r.note ? ` \u201C${esc(r.note)}\u201D` : ""}</li>`).join("")}</ul></section>` : ""}

  <div class="figs">
    <figure><h4>How late each collection was</h4>
      ${lineChart((s.refills||[]).map(r=>({x:r.day,y:r.delay_days,label:dmy(r.date)})),
        {refY:0,dp:0,changeX:cpR.change_position,changeLabel:"shift",
         none:"No dispensing events recorded yet.",aria:"days late per dispensing event"})}
      <figcaption>Measured in days against when each was due. The dashed marker is where the
        pattern changed against this patient's own history${cpR.baseline_mean != null
        ? ", from about " + fx(cpR.baseline_mean,1) + " days late to " + fx(cpR.recent_mean,1) : ""}.</figcaption>
    </figure>
    <figure><h4>How the estimate has moved</h4>
      ${lineChart((d.trajectory||[]).map(t=>({x:t.day,y:t.probability,label:dmy(t.date)})),
        {y0:0,y1:1,dp:2,refY:.5,aria:"estimate at each monthly review"})}
      <figcaption>Re-checked every 30 days. A rising line is a concern taking shape; a falling one
        is a concern settling.</figcaption></figure>
    <figure><h4>${esc(s.symptom_scale || "Symptoms they reported")}</h4>
      ${(s.symptoms||[]).length > 2
        ? lineChart(s.symptoms.map(r=>({x:r.day,y:r.score,label:dmy(r.date)})),
            {y0:0,y1:10,dp:0,changeX:cpS.change_position,color:"var(--quiet)",aria:"symptom burden"})
        : `<p class="nodata">This patient does not fill in symptom questionnaires, so the estimate
            rests on the other records.</p>`}</figure>
    <figure><h4>${esc(s.lab_marker || "Laboratory marker")}</h4>
      ${(s.labs||[]).length > 2
        ? lineChart(s.labs.map(r=>({x:r.day,y:r.value,label:dmy(r.date)})),
            {dp:1,color:"var(--quiet)",aria:"laboratory marker"})
        : `<p class="nodata">Too few laboratory results to show a trend.</p>`}
      <figcaption>In ${esc(s.lab_unit || "\u2014")}, read against this patient's own earlier range
        rather than a population norm.</figcaption></figure>
  </div>

  ${inf.attribution ? `<figure><h4>Which records moved the estimate</h4>
    ${barChart(inf.attribution.by_family.slice(0,5).map(x=>({label:x.label,value:x.contribution,
      display:(x.contribution>0?"+":"")+fx(x.contribution,2)})),{signed:true,aria:"attribution"})}
    <figcaption>Bars to the right raised the estimate, to the left lowered it. This describes the
      model's arithmetic, not the patient.</figcaption></figure>` : ""}

  <figure><h4>What happened, in order</h4>
    <ul class="tl">${tl}</ul>
    <figcaption>Italic entries in a dashed rule are the system's own inferences. Hatched entries
      are stretches where nothing was recorded at all, which is usually what a low confidence
      score is telling you. Everything else is a record from the health system.</figcaption></figure>

  <section class="review"><h3>Your view</h3>
    <p>What you decide is recorded, and it is the only thing that can correct the system over time.</p>
    <div class="acts">
      <button data-fb="reviewed">Mark reviewed</button>
      <button data-fb="escalated">Escalate</button>
      <button data-fb="needs_more_evidence">Needs more evidence</button>
      <button data-fb="false_positive" class="no">Not a concern</button>
    </div>
    <div class="done" id="done"></div>${hist}</section>

  <p class="foot">This is an inference from indirect records. It does not establish that any dose
    was missed, and it is not a judgement about this patient. Its purpose is to help you decide who
    to speak to, and what to ask about.</p>`;

  document.getElementById("back").onclick = () => {
    S.view = "list"; renderNav(); renderList(); scrollTo(0,0); };
  document.querySelectorAll("[data-fb]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    const out = document.getElementById("done");
    try {
      const r = await fetch("/api/alerts/" + p.patient_id + "/feedback", { method:"POST",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify({kind:b.dataset.fb}) });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      out.textContent = "Recorded. " + j.summary.adjudicated + " " +
        (j.summary.adjudicated === 1 ? "case has" : "cases have") +
        " now been reviewed by a person" +
        (j.summary.observed_false_positive_rate != null
          ? ", and " + pct(j.summary.observed_false_positive_rate) + " were judged not a concern."
          : ".");
    } catch (e) {
      out.textContent = "That could not be saved. Check the server is still running, then try again.";
      b.disabled = false;
    }
  });
}

/* ============================ patient portal ============================ */

const DOSE_WORDS = {
  all: "All of them", most: "Most of them", some: "Some of them",
  none: "None of them", unsure: "I'm not sure",
};

const FEELING_ENDS = ["Doing fine", "Having a hard time"];

async function loadPortal() {
  document.getElementById("main").innerHTML = `<p class="nodata">Loading…</p>`;
  try {
    S.portal = await get("/api/patients/" + encodeURIComponent(S.me) + "/portal");
    S.draft = { doses: null, symptom: null, barriers: [], note: "",
                date: new Date().toISOString().slice(0, 10) };
    renderPortal();
  } catch (e) {
    document.getElementById("main").innerHTML =
      `<div class="empty"><b>Could not load your record</b>${esc(e.message)}</div>`;
  }
}

function renderPortal() {
  const d = S.portal;
  if (!d) return;
  const meds = d.medications || [];
  const dr = S.draft;

  const due = d.next_refill_due
    ? `<div class="next"><h3>Your next repeat</h3>
        <div class="when">${dmy(d.next_refill_due)}</div>
        <p>Based on when you last collected${d.last_collected
          ? ", on " + dmy(d.last_collected) : ""}. If that no longer looks right, tell us below.</p></div>`
    : `<div class="next"><h3>Your next repeat</h3>
        <div class="when">Not scheduled</div>
        <p>We do not have a recent collection on file for you.</p></div>`;

  const doseBtns = (d.dose_options || []).map(o =>
    `<button data-dose="${esc(o)}" aria-pressed="${dr.doses === o}">${esc(DOSE_WORDS[o] || o)}</button>`).join("");

  const tagBtns = (d.barrier_options || []).map(b =>
    `<button data-tag="${esc(b.id)}" aria-pressed="${dr.barriers.indexOf(b.id) >= 0}">
      <span class="mark">${dr.barriers.indexOf(b.id) >= 0 ? "\u2713" : ""}</span>${esc(b.label)}</button>`).join("");

  const sym = dr.symptom == null ? 3 : dr.symptom;

  const past = (d.self_reports || []).length ? `<section class="past">
    <h3>What you've told us before</h3>
    <p>Your care team sees these next to your records.</p>
    <ul>${d.self_reports.slice(0, 6).map(r => `<li>
      <span class="when">${dmy(r.report_date)}</span>
      ${r.doses ? esc(DOSE_WORDS[r.doses] || r.doses) : "No answer given"}${
        r.symptom_score != null ? ", feeling " + fx(r.symptom_score, 0) + " out of 10" : ""}
      ${r.note ? `<div style="color:var(--quiet);margin-top:5px">\u201C${esc(r.note)}\u201D</div>` : ""}
      ${(r.barrier_labels || []).length
        ? `<div class="chips">${r.barrier_labels.map(b => `<span>${esc(b)}</span>`).join("")}</div>` : ""}
    </li>`).join("")}</ul></section>` : "";

  document.getElementById("main").innerHTML = `
    <span class="tag">Your medicines</span>
    <h2 class="greet">How have things been going?</h2>
    <p class="greet-sub">${esc(d.message)}</p>

    <div class="portal-top">
      <div class="regimen"><h3>What you're taking</h3>
        ${meds.length ? meds.map(m => `<div class="med">
          <span class="nm">${esc(m.name)}</span>
          <span class="fq">${m.doses_per_day} a day</span></div>`).join("")
        : `<p style="color:var(--quiet);font-size:.9rem;margin:0">No current medicines on file.</p>`}
      </div>
      ${due}
    </div>

    <section class="ask">
      <h2>Tell us how it's going</h2>
      <p class="intro">Every question is optional, and there are no wrong answers. This is not a
        test, and nothing you say here will count against you. It helps your care team work out
        what would actually be useful.</p>

      <div class="q"><h4>Over the past week, how many doses did you manage to take?</h4>
        <p class="hint">A rough sense is fine. Nobody remembers exactly.</p>
        <div class="choices" id="doses">${doseBtns}</div></div>

      <div class="q"><h4>How have you been feeling?</h4>
        <p class="hint">${esc(d.symptom_scale || "Zero means fine, ten means having a hard time.")}</p>
        <div class="slider-wrap">
          <input type="range" id="sym" min="0" max="10" step="1" value="${sym}"
            aria-label="How you have been feeling, 0 to 10">
          <span class="slider-val" id="symval">${dr.symptom == null ? "\u2013" : sym}</span>
        </div>
        <div class="slider-ends"><span>${esc(FEELING_ENDS[0])}</span><span>${esc(FEELING_ENDS[1])}</span></div></div>

      <div class="q"><h4>Has anything got in the way?</h4>
        <p class="hint">Tap anything that applies. These are common, and none of them are your
          fault — knowing which one it is changes what your team can offer.</p>
        <div class="tags" id="tags">${tagBtns}</div></div>

      <div class="q"><h4>Anything else you'd like them to know?</h4>
        <p class="hint">Optional, and in your own words.</p>
        <textarea id="note" placeholder="For example: the pharmacy was out of stock twice"
          aria-label="Anything else">${esc(dr.note)}</textarea>
        <div style="margin-top:14px"><label for="dt" class="hint"
          style="display:block;margin-bottom:6px">Which day is this about?</label>
        <input type="date" id="dt" value="${esc(dr.date)}" aria-label="Date this report is about"></div></div>

      <div class="send">
        <button id="submit">Send to my care team</button>
        <span class="said" id="said"></span>
      </div>

      <p class="privacy">What you write here is shown to your care team alongside your records.
        It is never used to score you, and it does not change any estimate the system has made:
        those come only from records like pharmacy collections and test results. Telling us
        something here can only add context, never count against you.</p>
    </section>

    ${past}

    <p class="foot">This page shows your own record and what you have chosen to tell us. Your care
      team sees additional clinical information that is not shown here.</p>`;

  wirePortal();
}

function wirePortal() {
  document.querySelectorAll("[data-dose]").forEach(b => b.onclick = () => {
    S.draft.doses = S.draft.doses === b.dataset.dose ? null : b.dataset.dose;
    renderPortal();
  });
  document.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => {
    const t = b.dataset.tag, i = S.draft.barriers.indexOf(t);
    if (i >= 0) S.draft.barriers.splice(i, 1); else S.draft.barriers.push(t);
    renderPortal();
  });
  const sym = document.getElementById("sym"), val = document.getElementById("symval");
  if (sym) sym.oninput = () => { S.draft.symptom = Number(sym.value); val.textContent = sym.value; };
  const note = document.getElementById("note");
  if (note) note.oninput = () => { S.draft.note = note.value; };
  const dt = document.getElementById("dt");
  if (dt) dt.onchange = () => { S.draft.date = dt.value; };

  const submit = document.getElementById("submit");
  if (submit) submit.onclick = async () => {
    const dr = S.draft, out = document.getElementById("said");
    if (dr.doses == null && dr.symptom == null && !dr.barriers.length && !dr.note.trim()) {
      out.textContent = "Answer anything you like first, then send.";
      return;
    }
    submit.disabled = true;
    try {
      const r = await fetch("/api/patients/" + encodeURIComponent(S.me) + "/self-report", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ report_date: dr.date, doses: dr.doses,
          symptom_score: dr.symptom, barriers: dr.barriers, note: dr.note.trim() || null }) });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      out.textContent = j.acknowledgement;
      S.portal = await get("/api/patients/" + encodeURIComponent(S.me) + "/portal");
      S.draft = { doses: null, symptom: null, barriers: [], note: "", date: dr.date };
      setTimeout(() => { renderPortal();
        const s2 = document.getElementById("said");
        if (s2) s2.textContent = j.acknowledgement; }, 700);
    } catch (e) {
      out.textContent = "That did not send. Check your connection and try again.";
      submit.disabled = false;
    }
  };
}

async function open_(pid) {
  document.getElementById("main").innerHTML = `<p class="nodata">Opening ${esc(pid)}\u2026</p>`;
  try {
    const d = await get("/api/patients/" + encodeURIComponent(pid));
    S.view = "detail"; renderDetail(d); scrollTo(0, 0);
  } catch (e) {
    document.getElementById("main").innerHTML =
      `<div class="empty"><b>${esc(pid)} could not be opened</b>${esc(e.message)}</div>`;
  }
}

function wire() {
  document.querySelectorAll("[data-go]").forEach(el => {
    el.onclick = () => open_(el.dataset.go);
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") {
      e.preventDefault(); open_(el.dataset.go); } };
  });
  document.querySelectorAll("[data-state]").forEach(b => b.onclick = () => {
    S.filters.state = b.dataset.state || null; renderList(); });
  const q = document.getElementById("q");
  if (q) q.oninput = e => {
    S.filters.q = e.target.value.trim().toLowerCase();
    const at = e.target.selectionStart;
    renderList();
    const n = document.getElementById("q");
    if (n) { n.focus(); n.setSelectionRange(at, at); }
  };
}

(async function boot() {
  try {
    const r = await Promise.all([get("/api/overview"), get("/api/patients?limit=2000")]);
    S.overview = r[0]; S.queue = r[1].patients;
    try { S.metrics = await get("/api/metrics"); } catch (e) {}
    try { S.demo = await get("/api/demo"); } catch (e) {}
    renderNav();
    renderList();
  } catch (e) {
    document.getElementById("nav").innerHTML = "";
    document.getElementById("main").innerHTML = `<div class="empty">
      <b>The server is not responding</b>
      Start it with <code>uvicorn backend.app.main:app</code> after running
      <code>scripts/generate_data.py</code> and <code>ml/train.py</code>.<br><br>${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
